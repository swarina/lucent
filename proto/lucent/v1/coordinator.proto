// Lucent coordinator service. Normative source: docs/protocol.md §1.3.
syntax = "proto3";
package lucent.v1;

import "lucent/v1/common.proto";

service CoordinatorService {
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc GetClusterState(ClusterStateRequest) returns (ClusterState);
}

message QueryRequest {
  string text = 1;
  uint32 k = 2;          // default 10
  uint32 ef_search = 3;  // default from config
  uint32 probe = 4;      // shards to probe; 0 = all (hash) / all (semantic)
  TraceLevel trace_level = 5;
}
message QueryResponse {
  repeated Hit hits = 1;
  bytes trace_id = 2;
  Coverage coverage = 3;
  Timings timings = 4;
  uint64 visited_total = 5;  // sum of per-shard visited (bench + UI counter)
}

message ClusterStateRequest {}
message ClusterState {
  ShardMap shard_map = 1;
  repeated NodeHealth nodes = 2;
}
message NodeHealth {
  string node_id = 1;
  HealthState health = 2;
  uint32 misses = 3;
}
