[project]
name = "lucent"
version = "0.0.1"
description = "Lucent control plane: dev supervisor, ingest, embedding service, bench, recorder."
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "xxhash>=3.4",
]

[project.optional-dependencies]
# Heavier deps land with their tasks to keep the base env fast to sync.
#   ingest (M0-T7): scikit-learn, umap-learn, zstandard, xxhash
# grpcio-tools (M0-T2) bundles protoc + pulls grpcio + protobuf, covering both
# codegen and the runtime the generated *_pb2_grpc modules import.
# CI runs `dev` only: embedsvc logic is tested with a fake encoder; the real
# model (torch + ~90MB download) is verified locally via the `embed` extra.
dev = [
  "pytest>=8.0",
  "grpcio-tools>=1.60",
  "numpy>=1.26",
]
ingest = [
  "numpy>=1.26",
  "grpcio>=1.60",
]
# UMAP is an opt-in projection (PCA is the default + fallback). Kept OUT of
# `ingest` because its numba/llvmlite chain won't resolve on newer Pythons —
# install only on Python <=3.12: `uv sync --extra umap`.
umap = [
  "umap-learn>=0.5",
]
embed = [
  "sentence-transformers>=3.0",
  "grpcio>=1.60",
  "numpy>=1.26",
]

[project.scripts]
lucent = "lucent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lucent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
