# Build + publish the all-in-one Lucent image to GHCR (M6-T4 / Level C).
# Runs on GitHub's native arm64 runner (free for public repos) so the image
# matches an Oracle Cloud Always-Free ARM host — the one free tier with enough
# RAM for the real MiniLM model. Deploy = `docker run` this image (deploy/README.md).
name: docker-image

on:
  workflow_dispatch:
  push:
    branches: [m6-t4-docker]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - ".github/workflows/docker.yml"
      - "cpp/**"
      - "proto/**"
      - "gateway/**"
      - "web/**"
      - "py/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build + push (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false  # vcpkg is re-cloned at the baseline inside the image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Real-model image: include the MiniLM/torch stack and default to the
          # real encoder. Build a slim --fake image by dropping these args.
          build-args: |
            EMBED_EXTRA=--extra embed
            DEFAULT_FAKE_EMBED=0
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:arm64
          # Registry cache (stored as a GHCR tag) — reliable, unlike the flaky
          # type=gha backend that failed the first run's cache export.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # Prove the published image actually boots (catches missing runtime deps).
      # Fake encoder + no ingest → fast; real ranking is verified separately.
      - name: Smoke test — image boots and serves /api/ready
        run: |
          IMG=ghcr.io/${{ github.repository }}:latest
          docker pull "$IMG"
          docker run -d --name smoke -p 8080:8080 -e LUCENT_FAKE_EMBED=1 -e LUCENT_CORPUS="" "$IMG"
          ok=0
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/ready >/dev/null 2>&1 && { ok=1; break; }
            sleep 3
          done
          echo "--- container logs ---"; docker logs smoke 2>&1 | tail -30
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = 1 ] && echo "SMOKE OK: cluster booted + /api/ready served" || { echo "SMOKE FAILED"; exit 1; }
