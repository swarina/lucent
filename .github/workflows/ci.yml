name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# C++ dependency strategy. GH runners have ~14GB free and gRPC's buildtrees
# exceed that, so we (a) drop preinstalled bloat, (b) build deps release-only
# via a custom triplet, (c) clean buildtrees after each port. For the binary
# cache we use actions/cache on vcpkg's archive dir — NOT vcpkg's x-gha
# backend, which silently no-ops against GitHub's current cache service.
# `cpp` builds deps once and saves the archive cache; asan/integration
# `needs: cpp` so they restore prebuilt archives (fast configure).
env:
  VCPKG_FLAGS: >-
    -DVCPKG_TARGET_TRIPLET=x64-linux-rel
    -DVCPKG_OVERLAY_TRIPLETS=triplets
    -DVCPKG_INSTALL_OPTIONS=--clean-after-build
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-archives

jobs:
  cpp:
    name: cpp (proto + build + smoke + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: vcpkg archive cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          # vcpkg.json carries builtin-baseline, so its hash captures both our
          # dep list and the pinned vcpkg version.
          key: vcpkg-x64-linux-rel-${{ hashFiles('vcpkg.json') }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - name: Bootstrap vcpkg
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" && ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure (builds deps once; restored from archive cache after)
        run: cmake --preset dev $VCPKG_FLAGS
      - name: Build
        run: cmake --build --preset dev
      - name: Smoke — binaries run
        run: |
          ./build/dev/cpp/lucent-hello
          ./build/dev/cpp/lucent-proto-smoke
      - name: Test
        run: ctest --preset dev --output-on-failure

  py:
    name: py (proto + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync
        run: uv sync --extra dev
        working-directory: py
      - name: Generate proto bindings
        run: bash tools/gen-proto.sh py
      - name: Bindings import
        run: uv run python -c "import lucent.v1.shard_pb2, lucent.v1.shard_pb2_grpc; print('proto import OK')"
        working-directory: py
      - name: CLI help works
        run: uv run lucent --help
        working-directory: py
      - name: Test
        run: uv run pytest -q
        working-directory: py

  web:
    name: web + gateway (proto + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Gateway install + generate + build
        working-directory: gateway
        run: npm install
      - name: Generate TS bindings
        run: bash tools/gen-proto.sh ts
      - name: Gateway build + test
        working-directory: gateway
        run: npm run build && npm test
      - name: Web build + test
        working-directory: web
        run: npm install && npm run build && npm test

  proto:
    name: proto (parse check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install grpcio-tools
        run: pip install "grpcio-tools>=1.60"
      - name: All protos parse and imports resolve
        run: python -m grpc_tools.protoc -I proto --descriptor_set_out=/dev/null proto/lucent/v1/*.proto

  asan:
    name: cpp asan/ubsan
    runs-on: ubuntu-latest
    needs: cpp  # archive cache is warm (saved by cpp) → fast configure
    env:
      # Our vcpkg deps (protobuf/grpc/abseil) are built release, WITHOUT ASan.
      # std::string/vector they create and our instrumented code touches trip
      # ASan's container-overflow annotation check, which requires whole-program
      # instrumentation → guaranteed false positive. Disable that one check;
      # every real check (use-after-free, heap-overflow, UBSan) stays on.
      ASAN_OPTIONS: detect_container_overflow=0
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: vcpkg archive cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-linux-rel-${{ hashFiles('vcpkg.json') }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - name: Bootstrap vcpkg
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" && ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure + build (asan preset)
        run: cmake --preset asan $VCPKG_FLAGS && cmake --build --preset asan
      - name: Test under ASan/UBSan
        run: ctest --preset asan --output-on-failure

  integration:
    name: integration (smoke + failover suite)
    runs-on: ubuntu-latest
    needs: cpp  # archive cache is warm (saved by cpp) → fast configure
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: vcpkg archive cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-x64-linux-rel-${{ hashFiles('vcpkg.json') }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Bootstrap vcpkg
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" && ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Build C++ (deps restored from archive cache)
        run: cmake --preset dev $VCPKG_FLAGS && cmake --build --preset dev
      - name: Build gateway + web
        run: |
          (cd gateway && npm install)
          bash tools/gen-proto.sh ts
          (cd gateway && npm run build)
          (cd web && npm install && npm run build)
      - name: Python env + bindings
        run: |
          (cd py && uv sync --extra dev --extra ingest)
          bash tools/gen-proto.sh py
      - name: Boot cluster (fake encoder — no torch in CI)
        run: |
          uv --project py run lucent dev --shards 2 --fake-embed > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do grep -q "cluster ready" /tmp/dev.log && break; sleep 2; done
          grep "cluster ready" /tmp/dev.log
      - name: Ingest 2k corpus
        run: uv --project py run lucent ingest --config .lucent/cluster-dev.yaml --corpus testdata/corpus-2k.jsonl --n 2000
      - name: Steel-thread smoke (query, spans, chaos, recovery)
        run: uv --project py run python py/tools/integration_smoke.py
      - name: Bench recall gates (fake vectors, deterministic)
        run: uv --project py run lucent bench --config .lucent/cluster-dev.yaml --queries 100 --ef 16,100 --gate --probe 0,1
      - name: Determinism gate — round A digest
        run: uv --project py run python py/tools/make_golden.py --digest /tmp/digestA.json
      - name: Determinism gate — fresh cluster, round B, compare
        run: |
          pkill -f "lucent dev" || true; sleep 2
          pkill -f "lucent-shard|lucent-coord|embedsvc|dist/index.js" || true; sleep 1
          rm -rf data .lucent
          uv --project py run lucent dev --shards 2 --fake-embed > /tmp/dev2.log 2>&1 &
          for i in $(seq 1 60); do grep -q "cluster ready" /tmp/dev2.log && break; sleep 2; done
          uv --project py run lucent ingest --config .lucent/cluster-dev.yaml --corpus testdata/corpus-2k.jsonl --n 2000
          uv --project py run python py/tools/make_golden.py --digest /tmp/digestB.json
          uv --project py run python py/tools/make_golden.py --compare /tmp/digestA.json /tmp/digestB.json
      - name: Semantic partitioning end-to-end (M4)
        run: |
          # Runs AFTER the determinism gate: it re-ingests under a DIFFERENT
          # partitioning (semantic), which places docs on different shards and so
          # must not leak into the two hash-partitioned determinism rounds above.
          # Re-ingest under semantic k-means and bench it, merging both series
          # into bench.json (the ops-panel chart). Exercises the whole path:
          # centroids written, coordinator loads + routes by centroid. The
          # semantic recall gate is real-encoder-only (fake vectors carry no
          # topic), so here we assert the mechanics + full-probe recall.
          pkill -f "lucent dev" || true; sleep 2
          pkill -f "lucent-shard|lucent-coord|embedsvc|dist/index.js" || true; sleep 1
          rm -rf data .lucent
          uv --project py run lucent dev --shards 2 --partitioning semantic --fake-embed > /tmp/dev-sem.log 2>&1 &
          for i in $(seq 1 60); do grep -q "cluster ready" /tmp/dev-sem.log && break; sleep 2; done
          grep "cluster ready" /tmp/dev-sem.log
          uv --project py run lucent ingest --config .lucent/cluster-dev.yaml --corpus testdata/corpus-2k.jsonl --n 2000
          test -f data/centroids.f32 && test -f data/partition.json  # artifacts written
          uv --project py run lucent bench --config .lucent/cluster-dev.yaml --queries 100 --ef 16,100 --probe 0,1 --gate --merge
          python -c "import json; c=json.load(open('bench/results/bench.json'))['configs']; assert any(x['partitioning']=='semantic' for x in c), 'no semantic series'; print('bench.json:', len(c), 'configs across', {x['partitioning'] for x in c})"
      - name: Failover suite under load (replicas=2)
        run: |
          pkill -f "lucent dev" || true; sleep 2
          pkill -f "lucent-shard|lucent-coord|embedsvc|dist/index.js" || true; sleep 1
          rm -rf data .lucent
          uv --project py run lucent dev --shards 2 --replicas 2 --fake-embed > /tmp/dev3.log 2>&1 &
          for i in $(seq 1 60); do grep -q "cluster ready" /tmp/dev3.log && break; sleep 2; done
          grep "cluster ready" /tmp/dev3.log
          # Ingest to primaries; replication mirrors to backups; seal seals both.
          uv --project py run lucent ingest --config .lucent/cluster-dev.yaml --corpus testdata/corpus-2k.jsonl --n 2000
          # 20 qps storm, SIGKILL a primary at t=5s + a slow-fault variant:
          # zero failed queries, exact coverage, promotion recovers < 5s (PLAN §7).
          uv --project py run python py/tools/failover_suite.py --scenario all --duration 12 --at 5
      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/dev.log /tmp/dev3.log 2>/dev/null || true
