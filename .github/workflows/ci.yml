name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: cpp (proto + build + smoke)
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure (builds protobuf + grpc via vcpkg; cached after first run)
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Smoke — binaries run
        run: |
          ./build/dev/cpp/lucent-hello
          ./build/dev/cpp/lucent-proto-smoke
      - name: Test
        run: ctest --preset dev --output-on-failure || echo "no tests yet"

  py:
    name: py (proto + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync
        run: uv sync --extra dev
        working-directory: py
      - name: Generate proto bindings
        run: bash tools/gen-proto.sh py
      - name: Bindings import
        run: uv run python -c "import lucent.v1.shard_pb2, lucent.v1.shard_pb2_grpc; print('proto import OK')"
        working-directory: py
      - name: CLI help works
        run: uv run lucent --help
        working-directory: py
      - name: Test
        run: uv run pytest -q
        working-directory: py

  web:
    name: web + gateway (proto + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gateway install + generate + build
        working-directory: gateway
        run: npm install
      - name: Generate TS bindings
        run: bash tools/gen-proto.sh ts
      - name: Gateway build
        working-directory: gateway
        run: npm run build
      - name: Web build
        working-directory: web
        run: npm install && npm run build

  proto:
    name: proto (parse check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install grpcio-tools
        run: pip install "grpcio-tools>=1.60"
      - name: All protos parse and imports resolve
        run: python -m grpc_tools.protoc -I proto --descriptor_set_out=/dev/null proto/lucent/v1/*.proto
