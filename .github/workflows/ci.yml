name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: cpp (build + smoke)
    runs-on: ubuntu-latest
    env:
      # GitHub Actions cache as the vcpkg binary cache (PLAN.md §2).
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Smoke — hello binary runs
        run: ./build/dev/cpp/lucent-hello
      - name: Test
        run: ctest --preset dev --output-on-failure || echo "no tests yet"

  py:
    name: py (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync
        working-directory: py
        run: uv sync --extra dev
      - name: CLI help works
        working-directory: py
        run: uv run lucent --help
      - name: Test
        working-directory: py
        run: uv run pytest -q

  web:
    name: web + gateway (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gateway build
        working-directory: gateway
        run: npm install && npm run build
      - name: Web build
        working-directory: web
        run: npm install && npm run build

  proto:
    name: proto (codegen is in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and check for drift
        run: |
          bash tools/gen-proto.sh
          git diff --exit-code
