name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# C++ jobs share these: GH runners have ~14GB free and gRPC's buildtrees
# exceed that, so we (a) drop preinstalled bloat, (b) build deps release-only
# via a custom triplet, (c) clean buildtrees after each port, (d) build deps
# once in `cpp` and let asan/integration restore from the binary cache.
env:
  VCPKG_FLAGS: >-
    -DVCPKG_TARGET_TRIPLET=x64-linux-rel
    -DVCPKG_OVERLAY_TRIPLETS=triplets
    -DVCPKG_INSTALL_OPTIONS=--clean-after-build

jobs:
  cpp:
    name: cpp (proto + build + smoke + test)
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure (builds deps via vcpkg; cached after first success)
        run: cmake --preset dev $VCPKG_FLAGS
      - name: Build
        run: cmake --build --preset dev
      - name: Smoke — binaries run
        run: |
          ./build/dev/cpp/lucent-hello
          ./build/dev/cpp/lucent-proto-smoke
      - name: Test
        run: ctest --preset dev --output-on-failure

  py:
    name: py (proto + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Sync
        run: uv sync --extra dev
        working-directory: py
      - name: Generate proto bindings
        run: bash tools/gen-proto.sh py
      - name: Bindings import
        run: uv run python -c "import lucent.v1.shard_pb2, lucent.v1.shard_pb2_grpc; print('proto import OK')"
        working-directory: py
      - name: CLI help works
        run: uv run lucent --help
        working-directory: py
      - name: Test
        run: uv run pytest -q
        working-directory: py

  web:
    name: web + gateway (proto + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Gateway install + generate + build
        working-directory: gateway
        run: npm install
      - name: Generate TS bindings
        run: bash tools/gen-proto.sh ts
      - name: Gateway build + test
        working-directory: gateway
        run: npm run build && npm test
      - name: Web build + test
        working-directory: web
        run: npm install && npm run build && npm test

  proto:
    name: proto (parse check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install grpcio-tools
        run: pip install "grpcio-tools>=1.60"
      - name: All protos parse and imports resolve
        run: python -m grpc_tools.protoc -I proto --descriptor_set_out=/dev/null proto/lucent/v1/*.proto

  asan:
    name: cpp asan/ubsan
    runs-on: ubuntu-latest
    needs: cpp  # deps restored from the cache `cpp` populated
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure + build (asan preset)
        run: cmake --preset asan $VCPKG_FLAGS && cmake --build --preset asan
      - name: Test under ASan/UBSan
        run: ctest --preset asan --output-on-failure

  integration:
    name: integration (steel-thread smoke)
    runs-on: ubuntu-latest
    needs: cpp  # deps restored from the cache `cpp` populated
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Build C++ (cache-restored)
        run: cmake --preset dev $VCPKG_FLAGS && cmake --build --preset dev
      - name: Build gateway + web
        run: |
          (cd gateway && npm install)
          bash tools/gen-proto.sh ts
          (cd gateway && npm run build)
          (cd web && npm install && npm run build)
      - name: Python env + bindings
        run: |
          (cd py && uv sync --extra dev --extra ingest)
          bash tools/gen-proto.sh py
      - name: Boot cluster (fake encoder — no torch in CI)
        run: |
          uv --project py run lucent dev --shards 2 --fake-embed > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do grep -q "cluster ready" /tmp/dev.log && break; sleep 2; done
          grep "cluster ready" /tmp/dev.log
      - name: Ingest 2k corpus
        run: uv --project py run lucent ingest --config .lucent/cluster-dev.yaml --corpus testdata/corpus-2k.jsonl --n 2000
      - name: Steel-thread smoke (query, spans, chaos, recovery)
        run: uv --project py run python py/tools/integration_smoke.py
      - name: Dump logs on failure
        if: failure()
        run: cat /tmp/dev.log
